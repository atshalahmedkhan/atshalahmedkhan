name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: atshalahmedkhan
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=FF2200&color_dots=#0d0000,#3d0000,#6b0000,#990000,#FF2200
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=FF2200&color_dots=#0d0000,#3d0000,#6b0000,#990000,#FF2200
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
